name: Build admin Android app

# Builds admin-mobile-app (the Capacitor wrapper around
# admin-app/mobile) into an Android APK.
#
# android/ is never committed — this workflow generates it fresh every
# run with `npx cap add android`, then patches the generated Gradle
# files to wire up Firebase Cloud Messaging (for order-alert push
# notifications) *if* the two setup secrets below are present. Without
# them, this still produces a fully working debug APK — order alerts
# just fall back to the in-app 5s poll instead of a real push.
#
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICES_JSON_BASE64  — base64 of Firebase's google-services.json
#                                  (see admin-mobile-app/README.md)
#   ANDROID_KEYSTORE_BASE64      — base64 of a release-signing .jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                — the four together also produce a
#                                  signed release APK/AAB; leave any
#                                  one unset and only the debug APK
#                                  gets built.
# Optional repository variable:
#   CLOUD_API_BASE — your deployed cloud-api URL, pre-fills the app's
#                    login screen instead of leaving it blank.

on:
  push:
    branches: [main]
    paths:
      - 'admin-app/**'
      - 'admin-mobile-app/**'
      - '.github/workflows/android-admin-build.yml'
  workflow_dispatch: {}

concurrency:
  group: android-admin-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
  HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners ship an Android SDK already, but
      # pinning it explicitly keeps this workflow working even if that
      # ever changes, and guarantees the platform/build-tools versions
      # Capacitor 6 expects are present.
      - uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Write build-time config (Cloud API URL)
        run: |
          cat > ../admin-app/mobile/config.js << EOF
          // Generated by .github/workflows/android-admin-build.yml — do
          // not hand-edit; this file is overwritten on every build.
          // The login screen's "Cloud API URL" field always overrides
          // this at runtime and is what actually gets saved on-device.
          window.POS_CONFIG = {
            CLOUD_API_BASE: '${{ vars.CLOUD_API_BASE }}',
          };
          EOF

      - name: Generate native Android project
        run: npx cap add android

      - name: Wire up Firebase (google-services.json)
        if: env.HAS_FIREBASE == 'true'
        run: |
             cat << 'EOF' > android/app/google-services.json
              ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
             EOF

      # Idempotent either way: adds the google-services Gradle
      # classpath if it's missing, and — belt and suspenders, in case
      # a future Capacitor template already includes it — only appends
      # the "apply plugin" block to app/build.gradle if no such block
      # exists yet. The apply itself is wrapped in a try/catch keyed
      # off whether google-services.json actually exists, so this step
      # is safe to run even when HAS_FIREBASE is false: the plugin
      # just won't do anything.
      - name: Patch Gradle files for Firebase
        run: node ../.github/workflows/scripts/patch-google-services.js

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: admin-mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-debug-apk
          path: admin-mobile-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # Reopening `android { ... }` a second time in the same file is
      # valid Gradle/Groovy DSL — buildTypes.release already exists
      # from the block Capacitor generated, so this configures it in
      # place rather than redefining it. Secrets are read from env vars
      # at build time, never written into the file itself.
      - name: Configure release signing
        if: env.HAS_SIGNING == 'true'
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CI_KEYSTORE_PATH"))
                      storePassword System.getenv("CI_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CI_KEY_ALIAS")
                      keyPassword System.getenv("CI_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release (APK + AAB)
        if: env.HAS_SIGNING == 'true'
        working-directory: admin-mobile-app/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          CI_KEYSTORE_PATH: ${{ github.workspace }}/admin-mobile-app/android/app/release.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed release build
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-release-build
          path: |
            admin-mobile-app/android/app/build/outputs/apk/release/*.apk
            admin-mobile-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
