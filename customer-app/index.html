<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Order</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar sticky-top">
  <div class="d-flex align-items-center justify-content-between px-3 py-2">
    <span class="brand">Order here</span>
    <span class="table-badge" id="tableBadge"></span>
  </div>
  <nav class="category-nav" id="categoryNav"></nav>
</header>

<!-- Stage layout hero (Theme 2) -->
<section id="stageSection" class="stage-section" hidden>
  <div class="stage-plate-wrap">
    <div class="stage-shadow"></div>
    <div class="stage-plate">
      <img id="stageImg" src="" alt="Featured dish">
      <div class="stage-steam s1"></div>
      <div class="stage-steam s2"></div>
    </div>
  </div>
  <div class="stage-hud">
    <div class="stage-badge" id="stageBadge">Chef's Choice</div>
    <div class="stage-title" id="stageTitle"></div>
    <div class="stage-desc" id="stageDesc"></div>
    <div class="stage-price" id="stagePrice"></div>
    <button class="stage-add-btn" id="stageAddBtn" type="button">Add to order</button>
  </div>
</section>

<main id="menu" class="pb-5"></main>

<div class="state-message" id="loadingMessage">Loading menu…</div>

<!-- Floating cart bar -->
<button class="cart-bar" id="cartBar" hidden type="button">
  <span id="cartCount">0 items</span>
  <span id="cartTotal">0 MMK</span>
</button>

<!-- Product detail modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="productModalContent"></div>
  </div>
</div>

<!-- Cart / checkout modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" id="checkoutModalContent"></div>
  </div>
</div>

<!-- Ambient music toggle -->
<button class="ambient-toggle" id="ambientToggle" hidden aria-label="Toggle background music">&#9834;</button>
<audio id="ambientAudio" loop preload="none"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/api/config"></script>
<script src="app.js"></script>
</body>
</html>
