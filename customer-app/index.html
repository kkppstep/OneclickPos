<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">Order here</span>
    <span class="table-badge" id="tableBadge"></span>
  </div>
</header>

<main id="app">
  <div class="state-message" id="loadingMessage">Loading menu…</div>
</main>

<!-- Cart bar, hidden until first item is added -->
<button class="cart-bar" id="cartBar" hidden>
  <span id="cartCount">0 items</span>
  <span id="cartTotal">0 MMK</span>
</button>

<!-- Cart / checkout drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-handle"></div>
  <div id="drawerContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>
