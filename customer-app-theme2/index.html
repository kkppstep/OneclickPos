<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OneclickPos">
    <meta name="theme-color" content="#0c0a0e">
    <meta name="description" content="OneclickPos - Premium Myanmar POS System">
    <title>Order</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0c0a0e;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .burmese-text { font-family: 'Padauk', 'Montserrat', sans-serif; }
        .serif-title { font-family: 'Cinzel', serif; }

        .glass-panel {
            background: rgba(18, 14, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .text-glow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 0.9); }

        .gold-gradient { background: linear-gradient(135deg, #fce0ad 0%, #dfb26c 50%, #b89742 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes float-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .float-in { animation: float-in 0.6s ease-out forwards; }
    </style>
</head>
<body class="relative h-screen w-screen flex flex-col overflow-hidden" style="background-color: #0c0a0e;">

    <!-- Ambient glow -->
    <div id="ambient-glow" style="position: absolute; top: 25%; left: 25%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(124, 58, 237, 0.1), transparent); border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; transition: all 0.7s ease;"></div>

    <div style="position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; width: 100%;">
        
        <!-- HEADER -->
        <header style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(12, 10, 14, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
            <div>
                <h1 style="margin: 0; color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 0.05em;">Order here</h1>
                <p style="margin: 2px 0 0 0; color: #a78bfa; font-size: 7px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;">OneclickPos Kitchen</p>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span id="table-badge" onclick="changeTableID()" style="cursor: pointer; border: 1px solid rgba(168, 85, 247, 0.3); background: rgba(88, 28, 135, 0.2); color: #c084fc; padding: 4px 12px; border-radius: 999px; font-size: 9px; font-weight: bold; transition: all 0.3s;">Table 1</span>
                <button onclick="toggleCartDrawer()" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #fbbf24; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 14px; transition: all 0.3s;" title="View cart">
                    <i class="fa-solid fa-bell-concierge"></i>
                    <span id="cart-count" style="position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; width: 16px; height: 16px; border-radius: 50%; font-size: 7px; font-weight: bold; display: none; align-items: center; justify-content: center;">0</span>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            
            <!-- CATEGORY TABS -->
            <nav style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; overflow-x: auto; display: flex; gap: 8px;">
                <button onclick="filterCategory('all')" class="category-tab active" style="flex-shrink: 0; padding: 8px 16px; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; border-radius: 8px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s; min-height: 32px;">All</button>
                <button onclick="filterCategory('new')" class="category-tab" style="flex-shrink: 0; padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #d1d5db; border-radius: 8px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s; min-height: 32px;">New</button>
                <button onclick="filterCategory('special')" class="category-tab" style="flex-shrink: 0; padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #d1d5db; border-radius: 8px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s; min-height: 32px;">Special</button>
            </nav>

            <!-- MENU GRID -->
            <div id="menu-grid" style="flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; -webkit-overflow-scrolling: touch;">
                <!-- Products loaded here -->
            </div>
        </main>
    </div>

    <!-- CART DRAWER -->
    <aside id="cart-drawer" style="position: fixed; top: 0; right: 0; width: 100%; max-width: 380px; height: 100%; background: #110d16; border-left: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0,0,0,0.9); z-index: 50; transform: translateX(100%); transition: transform 0.5s ease-out; display: flex; flex-direction: column; overflow: hidden;">
        <div style="padding: 20px; display: flex; flex-direction: column; height: 100%; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <h3 style="margin: 0; color: white; font-size: 13px; font-weight: bold; letter-spacing: 0.05em; font-family: 'Cinzel', serif;">Your Order</h3>
                <button onclick="toggleCartDrawer()" style="background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 8px; min-height: 38px; min-width: 38px;">×</button>
            </div>

            <div id="cart-items" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                <!-- Cart items loaded here -->
            </div>

            <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #9ca3af;">
                    <span>Subtotal</span>
                    <span id="subtotal">0 MMK</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #9ca3af;">
                    <span>Service Fee</span>
                    <span id="fee">500 MMK</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: white; font-weight: bold; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <span>Total</span>
                    <span id="total" class="gold-gradient">0 MMK</span>
                </div>
                <button onclick="submitOrder()" style="width: 100%; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; transition: all 0.3s; min-height: 40px;">Submit Order</button>
            </div>
        </div>
    </aside>

    <!-- BACKDROP OVERLAY FOR CART -->
    <div id="cart-overlay" onclick="toggleCartDrawer()" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s;"></div>

    <script src="/api/config"></script>
    <script src="app.js"></script>
</body>
</html>
